<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Reset Password - SKP Lab CRM</title><link rel="stylesheet" th:href="@{/css/crm.css}"></head>
<body class="center-page">
<main class="card login-card">
    <div class="brand">SKP LAB CRM</div>
    <h1>Set New Password</h1>
    <div class="alert error" th:if="${error}" th:text="${error}"></div>
    <p class="muted">Your OTP has been verified. Choose a new password of at least 12 characters with a letter, number and special character.</p>
    <form method="post" th:action="@{/crm/reset-password}">
        <label>New Password<input type="password" name="newPassword" autocomplete="new-password" minlength="12" required></label>
        <label>Confirm New Password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="12" required></label>
        <button class="button" type="submit">Reset Password</button>
    </form>
</main>
</body>
</html>
