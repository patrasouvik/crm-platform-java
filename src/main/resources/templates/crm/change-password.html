<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Change Password - SKP Lab CRM</title><link rel="stylesheet" th:href="@{/css/crm.css}"></head>
<body>
<header class="topbar"><strong>SKP LAB CRM</strong><div><span>Admin</span><form class="inline" method="post" th:action="@{/crm/logout}"><button class="link-button">Logout</button></form></div></header>
<main class="container">
    <div class="card form-card">
        <h1>Change Password</h1>
        <div class="alert error" th:if="${error}" th:text="${error}"></div>
        <p class="muted">Use a password of at least 12 characters with a letter, number and special character.</p>
        <form method="post" th:action="@{/crm/admin/change-password}">
            <label>Current Password<input type="password" name="currentPassword" autocomplete="current-password" required></label>
            <label>New Password<input type="password" name="newPassword" autocomplete="new-password" minlength="12" required></label>
            <label>Confirm New Password<input type="password" name="confirmPassword" autocomplete="new-password" minlength="12" required></label>
            <div class="actions">
                <button class="button" type="submit">Change Password</button>
                <a class="button secondary" href="/crm/admin">Cancel</a>
            </div>
        </form>
    </div>
</main>
</body>
</html>
