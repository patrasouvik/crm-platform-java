<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Forgot Password - SKP Lab CRM</title><link rel="stylesheet" th:href="@{/css/crm.css}"></head>
<body class="center-page">
<main class="card login-card">
    <div class="brand">SKP LAB CRM</div>
    <h1>Forgot Password</h1>
    <p class="muted">Enter your admin email address. If it is registered, a six-digit OTP will be sent to it.</p>
    <form method="post" th:action="@{/crm/forgot-password}">
        <label>Email Address<input type="email" name="email" autocomplete="email" required></label>
        <button class="button" type="submit">Send OTP</button>
    </form>
    <a class="back-link" href="/crm/login">Back to Login</a>
</main>
</body>
</html>
