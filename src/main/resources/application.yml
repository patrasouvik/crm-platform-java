spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${SPRING_DATASOURCE_USERNAME:crm}
    password: ${SPRING_DATASOURCE_PASSWORD:crm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  thymeleaf:
    cache: false

crm:
  admin:
    bootstrap:
      enabled: ${CRM_ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${CRM_ADMIN_USERNAME:admin}
      password: ${CRM_ADMIN_PASSWORD:change-me}

management:
  endpoints:
    web:
      exposure:
        include: health,info
