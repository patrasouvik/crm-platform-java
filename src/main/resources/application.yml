spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/crm}
    username: ${SPRING_DATASOURCE_USERNAME:crm}
    password: ${SPRING_DATASOURCE_PASSWORD:crm}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 1
  thymeleaf:
    cache: false

crm:
  admin:
    bootstrap:
      enabled: ${CRM_ADMIN_BOOTSTRAP_ENABLED:true}
      username: ${CRM_ADMIN_USERNAME:admin}
      email: ${CRM_ADMIN_EMAIL:souvik.k.patra@gmail.com}
      password: ${CRM_ADMIN_PASSWORD:change-me}
  mail:
    enabled: ${CRM_MAIL_ENABLED:false}
    from: ${CRM_MAIL_FROM:noreply@skp-lab.com}
    otp-expiry-minutes: ${CRM_OTP_EXPIRY_MINUTES:10}

spring:
  mail:
    host: ${SPRING_MAIL_HOST:}
    port: ${SPRING_MAIL_PORT:587}
    username: ${SPRING_MAIL_USERNAME:}
    password: ${SPRING_MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
